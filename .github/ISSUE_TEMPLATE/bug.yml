name: Bug report
description: Report something that does not work as documented
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here and do not include credentials or personal data. Use the security policy instead.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps, commands, or input.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
    validations:
      required: true