[general]
domain = "wendeburg-calendar.test"
database = "db.sqlite3"
output = "calendar.ics"
user_agent = "WendeburgCalendarBot/0.1 (+https://example.org/contact; contact=test@example.org)"
timezone = "Europe/Berlin"

[harvest]
missing_threshold = 3
missing_grace_days = 7
max_events_per_source = 500
request_timeout_seconds = 15
max_content_bytes = 5000000

[llm]
enabled = true
default_model = "gpt-5.6-luna"
max_input_chars = 6000

[[sources]]
id = "wendeburg"
type = "wendeburg"
enabled = true
seed_urls = [
    "https://www.wendeburg.de/freizeit-kultur/veranstaltungen/veranstaltungen/",
    "https://www.wendeburg.de/regional/veranstaltungen/suche.html",
]
allowed_hosts = ["www.wendeburg.de"]
