[general]
domain = "wendeburg-calendar.test"
database = "db.sqlite3"
output = "calendar.ics"
user_agent = "WendeburgCalendarBot/0.1 (+https://example.org/contact)"
timezone = "Europe/Berlin"

[harvest]
missing_threshold = 3
missing_grace_days = 7
max_events_per_source = 100
request_timeout_seconds = 15
max_content_bytes = 5000000

[llm]
enabled = true
default_model = "gpt-5.6-luna"
max_input_chars = 6000

[[sources]]
id = "peine-erleben"
type = "peine-erleben"
seed_urls = ["https://www.peine-erleben.de/sitemap.xml"]
allowed_hosts = ["www.peine-erleben.de"]

[[sources]]
id = "kulturring-peine"
type = "structured-html"
profile = "kulturring-peine"
seed_urls = ["https://www.kulturring-peine.de/kulturring-peine/terminkalender/index.php"]
allowed_hosts = ["www.kulturring-peine.de"]

[[sources]]
id = "tourismus-peine"
type = "structured-html"
profile = "tourismus-peine"
seed_urls = ["https://www.tourismus-peine.de/events"]
allowed_hosts = ["www.tourismus-peine.de"]

[[sources]]
id = "zweidorf-online"
type = "structured-html"
profile = "zweidorf-online"
seed_urls = ["https://www.zweidorf-online.de/Veranstaltungen/"]
allowed_hosts = ["www.zweidorf-online.de"]

[[sources]]
id = "kirche-wendeburg"
type = "structured-html"
profile = "kirche-lkcal"
seed_urls = [
  "https://www.kirche-wendeburg.de/aktuell/gottesdienste/list",
  "https://www.kirche-wendeburg.de/aktuell/termine-gemeinde/list",
]
allowed_hosts = ["www.kirche-wendeburg.de"]

[[sources]]
id = "kirche-bortfeld"
type = "structured-html"
profile = "kirche-bortfeld"
seed_urls = ["https://www.kirche-bortfeld.de/aktuell/gottesdienste-in-bortfeld"]
allowed_hosts = ["www.kirche-bortfeld.de"]
